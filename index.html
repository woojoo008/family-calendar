<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8e6e3">
<title>Lee Family Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

<!-- Firebase (compat build) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --ink:#6b4630;--ink2:#9b7862;--frame:#edc8b8;--paper:#fffdfb;--bg:#f8e6e3;
  --line:#f1dcd4;--coral:#f0776a;--coral-d:#c95a4f;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  font-family:'Nunito',ui-rounded,system-ui,-apple-system,sans-serif;color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(90deg,rgba(228,170,170,.26) 50%,transparent 50%),
    linear-gradient(rgba(228,170,170,.26) 50%,transparent 50%);
  background-size:64px 64px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;padding:16px 14px 40px}

/* header plate */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.plate{background:var(--paper);border:9px solid var(--frame);border-radius:30px 38px 28px 36px;
  box-shadow:0 0 0 4px #fff,0 10px 22px rgba(150,95,80,.16);padding:8px 22px 10px;position:relative}
.plate::after{content:"★";position:absolute;right:-14px;bottom:-16px;font-size:34px;color:var(--coral);
  text-shadow:0 0 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
h1{font-family:'Chewy','Nunito',cursive;font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1;margin:0;letter-spacing:.5px}
.plate p{margin:4px 0 0;font-size:13px;color:var(--ink2);font-weight:700}
.me{display:flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:999px;padding:5px 14px 5px 5px;
  box-shadow:0 0 0 3px var(--frame);cursor:pointer;font-weight:800}
.me small{display:block;font-weight:700;color:var(--ink2);font-size:11px}

nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:0;background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;
  box-shadow:0 0 0 3px #fff,0 0 0 5px var(--line)}
nav button[aria-current="page"]{background:var(--frame);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--frame)}

.demo{background:#fff6d6;border:2px dashed #e8c66a;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:12px}

.panel{background:var(--paper);border:10px solid var(--frame);border-radius:28px;padding:16px;
  box-shadow:0 0 0 4px #fff,0 10px 24px rgba(150,95,80,.14);margin-bottom:16px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;flex:1;font-family:'Chewy','Nunito',cursive;font-weight:400;font-size:26px;letter-spacing:.3px}
.icon{width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 2px var(--line);
  font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;font-weight:800}
.hint{color:var(--ink2);font-weight:700;font-size:14px;margin:0 0 12px;max-width:60ch}

.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--coral);color:#fff;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--coral-d);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.danger{background:#fff;color:#c2463b;box-shadow:0 0 0 2px #f3c7c1}
.link{background:none;border:0;color:var(--coral);font-weight:800;cursor:pointer;text-decoration:underline;padding:0}

.av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--soft);border:3px solid #fff;
  box-shadow:0 0 0 2px var(--c);display:grid;place-items:center;font-size:19px;line-height:1}
.av.big{width:74px;height:74px;flex-basis:74px;font-size:40px;border-width:4px;box-shadow:0 0 0 3px var(--c)}
.av.sm{width:28px;height:28px;flex-basis:28px;font-size:15px;border-width:2px}

/* calendar */
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows span{text-align:center;font-size:12px;font-weight:800;color:var(--ink2);padding-bottom:4px}
.day{min-height:88px;background:#fff7f4;border:2px solid var(--line);border-radius:14px;padding:5px;text-align:left;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
.day.out{opacity:.42}
.day.sel{border-color:var(--ink);background:#fff}
.num{font-weight:800;font-size:14px;align-self:flex-start;padding:0 4px}
.day.today .num{background:var(--coral);color:#fff;border-radius:999px;padding:0 7px}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chips i{display:block;font-style:normal;font-size:11px;font-weight:800;background:var(--c);color:#fff;border-radius:6px;
  padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips em{font-style:normal;font-size:11px;font-weight:800;color:var(--ink2)}
@media (max-width:640px){
  .app{padding:12px 10px 30px}
  .panel{padding:12px;border-width:8px}
  .grid,.dows{gap:4px}
  .day{min-height:52px;padding:4px;border-radius:11px}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px;padding-left:3px}
  .chips i{width:8px;height:8px;padding:0;font-size:0;border-radius:50%}
  .chips em{font-size:9px}
}

/* event rows */
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:18px;background:var(--soft);
  border:2px solid transparent;text-align:left;cursor:pointer}
.ev:hover{border-color:var(--c)}
.evt{flex:1;min-width:0}
.evt b{display:block;font-size:16px;overflow-wrap:anywhere}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:12px;font-weight:800;background:#fff;border-radius:999px;padding:2px 9px;color:var(--ink2)}
.cnt{font-size:13px;font-weight:800}
.empty{text-align:center;color:var(--ink2);font-weight:700;padding:20px 8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(107,70,48,.35);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:20}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;margin:0;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0 0 env(safe-area-inset-bottom,0px)}
  .sheet{border-radius:26px 26px 0 0;max-height:92dvh}}
.sheethead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheethead h2{margin:0;font-family:'Chewy','Nunito',cursive;font-weight:400;font-size:26px;overflow-wrap:anywhere}
.sheethead>div{flex:1;min-width:0}
.sub{margin:0;color:var(--ink2);font-weight:700;font-size:14px}
.note{background:#fff7f4;border-radius:14px;padding:10px 12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
h3{font-size:15px;margin:18px 0 8px}

.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:14px}
.form small{font-weight:700;color:var(--ink2)}
input,select,textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--frame);outline:none;box-shadow:0 0 0 3px #f7dcd0}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:800;font-size:14px;margin-bottom:6px}
.who{display:flex;gap:6px;flex-wrap:wrap}
.form .whochip{flex-direction:row;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:6px 12px;
  cursor:pointer;border:2px solid transparent;font-size:14px}
.whochip input{position:absolute;opacity:0;width:1px;height:1px}
.whochip:has(input:checked){border-color:var(--c);background:#fff;box-shadow:0 0 0 2px var(--soft)}
.whochip:has(input:focus-visible){outline:3px solid var(--coral);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.addrow{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.addrow input{flex:1}

/* comments */
.cm{display:flex;gap:8px;margin-bottom:8px}
.cm div{background:var(--soft);border-radius:14px;padding:6px 10px;flex:1;min-width:0}
.cm small{font-weight:800;color:var(--ink2);font-size:12px}
.cm p{margin:2px 0 0;overflow-wrap:anywhere}

/* wishes */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.board{grid-template-columns:1fr}}
.col{background:var(--soft);border-radius:22px;padding:12px;border:3px solid #fff;box-shadow:0 0 0 2px var(--c)}
.colhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.colhead b{flex:1;font-family:'Chewy','Nunito',cursive;font-weight:400;font-size:22px}
.colhead .n{font-weight:800;font-size:13px;background:#fff;border-radius:999px;padding:1px 9px}
.wish{background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.wish p{margin:0 0 6px;font-weight:700;overflow-wrap:anywhere}
.wish.done{box-shadow:inset 0 0 0 2px #f6c9a6}
.wacts{display:flex;gap:6px}
.mini{border:0;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;background:var(--c);color:#fff;cursor:pointer}
.mini.ghost{background:#fff;color:var(--ink2);box-shadow:0 0 0 2px var(--line)}
.planned{border:0;background:#fff4e6;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink)}
.none{color:var(--ink2);font-size:13px;font-weight:700;margin:4px 2px}

.dayh{font-family:'Chewy','Nunito',cursive;font-weight:400;font-size:21px;margin:16px 0 8px}
.dayh:first-child{margin-top:0}

/* chat */
.chat{height:min(60vh,540px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px;margin-bottom:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.mine{flex-direction:row-reverse}
.bubble{background:var(--soft);border-radius:18px 18px 18px 6px;padding:7px 12px;max-width:75%}
.msg.mine .bubble{border-radius:18px 18px 6px 18px;box-shadow:inset 0 0 0 2px var(--c)}
.bubble small{font-weight:800;color:var(--ink2);font-size:11px}
.bubble p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* who */
.whopanel{max-width:560px;width:100%;text-align:center}
.whopanel h2{font-family:'Chewy','Nunito',cursive;font-weight:400;font-size:32px;margin:0 0 4px}
.whogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:460px){.whogrid{grid-template-columns:repeat(2,1fr)}}
.whogrid button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-weight:800;font-size:17px;padding:8px;border-radius:18px}
.whogrid button:hover{background:#fff4f0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="plate">
      <h1>Lee Family Calendar</h1>
      <p>For Appa, Umma, Irene &amp; Claire</p>
    </div>
    <button class="me" id="meBtn" data-act="switchMe" aria-label="Switch person"></button>
  </header>
  <div id="demo"></div>
  <nav aria-label="Sections">
    <button data-tab="cal">📅 Calendar</button>
    <button data-tab="wishes">💭 Weekly Wishes</button>
    <button data-tab="plans">🧺 Final Plans</button>
    <button data-tab="chat">💬 Family Chat Room</button>
  </nav>
  <main id="main"></main>
</div>

<div id="scrim" class="scrim" hidden><div class="panel sheet" role="dialog" aria-modal="true" id="sheetBody"></div></div>
<div id="who" class="scrim" hidden></div>
<div id="toast" role="status"></div>

<script>
/* ============================================================
   1) PASTE YOUR FIREBASE SETTINGS HERE
   Firebase console → Project settings → Your apps → Web app → Config
   Until you do, the app runs in demo mode (saved on this device only).
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBiTnrJrLjcRL7BYrjwBsLmXrE41LxlVn8",
  authDomain: "family-calender-15daf.firebaseapp.com",
  projectId: "family-calender-15daf",
  storageBucket: "family-calender-15daf.firebasestorage.app",
  messagingSenderId: "927464669089",
  appId: "1:927464669089:web:f8758993e855ae8ef695e0"
};

/* ============================================================ */
const MEMBERS = {
  appa:   {name:'Appa',   emoji:'🐥', color:'#f27a98', soft:'#fde2ea'},
  umma:   {name:'Umma',   emoji:'🐱', color:'#e3a21f', soft:'#fdf0cc'},
  irene:  {name:'Irene',  emoji:'🧸', color:'#b07a52', soft:'#f3e4d7'},
  claire: {name:'Claire', emoji:'🐰', color:'#a57fd6', soft:'#eee4fb'},
  family: {name:'Family', emoji:'🏡', color:'#4f9f7c', soft:'#dcf1e6'}
};
const PEOPLE = ['appa','umma','irene','claire'];
const REPEAT = {none:"Doesn't repeat", weekly:'Every week', monthly:'Every month', yearly:'Every year'};
const C = {events:'cal_events', comments:'cal_comments', wishes:'cal_wishes', chat:'cal_chat'};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -d.getDay());
const fmtTime = t => { if(!t) return 'All day'; let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${pad(m)} ${ap}`; };
const fmtDay = s => parse(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const lsGet = (k,f) => { try { const v = localStorage.getItem(k); return v==null?f:v; } catch(e){ return f; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const M = key => MEMBERS[key] || MEMBERS.family;
const mv = m => `--c:${m.color};--soft:${m.soft}`;
const av = (m,cls='') => `<span class="av ${cls}" style="${mv(m)}" aria-hidden="true">${m.emoji}</span>`;
const when = t => { const d = new Date(t); return ymd(d)===ymd(new Date())
  ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
  : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ', ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- storage: Firebase or local demo ---------- */
function makeFireStore(){
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  return {
    listen(c, f, opts={}){
      let q = db.collection(c);
      if(opts.latest) q = q.orderBy('createdAt','desc').limit(opts.latest);
      q.onSnapshot(s => f(s.docs.map(d => ({...d.data(), id:d.id}))), err => toast('Sync problem: ' + err.message));
    },
    async add(c,d){ const r = await db.collection(c).add(d); return r.id; },
    async update(c,id,d){ await db.collection(c).doc(id).update(d); },
    async remove(c,id){ await db.collection(c).doc(id).delete(); }
  };
}
function makeLocalStore(){
  const L = {};
  const read = c => { try { return JSON.parse(localStorage.getItem('famcal:'+c) || '[]'); } catch(e){ return []; } };
  const emit = c => (L[c]||[]).forEach(o => o.f(o.opts.latest ? read(c).sort((a,b)=>b.createdAt-a.createdAt).slice(0,o.opts.latest) : read(c)));
  const write = (c,a) => { try { localStorage.setItem('famcal:'+c, JSON.stringify(a)); } catch(e){} emit(c); };
  addEventListener('storage', e => { if(e.key && e.key.startsWith('famcal:cal_')) emit(e.key.slice(7)); });
  return {
    listen(c,f,opts={}){ (L[c] = L[c] || []).push({f,opts}); emit(c); },
    async add(c,d){ const id = Math.random().toString(36).slice(2,9) + Date.now().toString(36); const a = read(c); a.push({...d,id}); write(c,a); return id; },
    async update(c,id,d){ write(c, read(c).map(x => x.id===id ? {...x,...d} : x)); },
    async remove(c,id){ write(c, read(c).filter(x => x.id!==id)); }
  };
}
const configured = !!(window.firebase && firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE') && firebaseConfig.projectId);
let store;
try { store = configured ? makeFireStore() : makeLocalStore(); } catch(e){ store = makeLocalStore(); }
if(!configured) $('#demo').innerHTML = `<div class="demo">Demo mode: events are saved on this device only. Paste your Firebase settings into the file to share with the family.</div>`;

/* ---------- state ---------- */
const now = new Date();
const today = ymd(now);
const S = {
  me: lsGet('famcal:me',''), view:'cal',
  month: new Date(now.getFullYear(), now.getMonth(), 1), sel: today, week: weekStart(now),
  events:[], comments:[], wishes:[], chat:[], openId:null
};
if(!MEMBERS[S.me] || S.me==='family') S.me = '';

/* ---------- repeating events ---------- */
function occursOn(e, ds){
  if(!e.date || ds < e.date) return false;
  if(e.until && ds > e.until) return false;
  if(ds === e.date) return true;
  const a = parse(e.date), b = parse(ds);
  switch(e.repeat){
    case 'weekly':  return Math.round((b-a)/864e5) % 7 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    case 'yearly':  return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
  }
  return false;
}
const eventsOn = ds => S.events.filter(e => occursOn(e,ds)).sort((a,b) => (a.time||'').localeCompare(b.time||''));

/* ---------- views ---------- */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const weekBar = `<div class="bar"><button class="icon" data-act="wprev" aria-label="Previous week">‹</button><h2 id="weekTitle"></h2><button class="icon" data-act="wnext" aria-label="Next week">›</button></div>`;

function show(v){
  S.view = v;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab===v ? 'page' : 'false'));
  const main = $('#main');
  if(v==='cal') main.innerHTML = `
    <section class="panel">
      <div class="bar">
        <button class="icon" data-act="mprev" aria-label="Previous month">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="icon" data-act="mnext" aria-label="Next month">›</button>
        <button class="btn ghost sm" data-act="mtoday">Today</button>
      </div>
      <div class="dows">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="panel">
      <div class="bar"><h2 id="agendaTitle"></h2><button class="btn" data-act="newEvent">+ Add event</button></div>
      <div id="agenda"></div>
    </section>`;
  else if(v==='wishes') main.innerHTML = `
    <section class="panel">
      ${weekBar}
      <p class="hint">Write down what you want to do, or what we have to do, this week. Please be realistic in your choices!</p>
      <form id="wishForm" class="addrow"><span id="wishAv"></span><input id="wishIn" placeholder="My wish for this week" maxlength="120" required aria-label="New wish"><button class="btn">Add wish</button></form>
      <div class="board" id="board"></div>
    </section>`;
  else if(v==='plans') main.innerHTML = `
    <section class="panel">
      ${weekBar}
      <p class="hint">The wishes we turned into real plans for this week.</p>
      <div id="plans"></div>
    </section>`;
  else if(v==='chat') main.innerHTML = `
    <section class="panel">
      <div class="bar"><h2>Family Chat Room</h2></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form id="chatForm" class="addrow"><input id="chatIn" placeholder="Say something to the family" maxlength="500" required autocomplete="off" aria-label="Message"><button class="btn">Send</button></form>
    </section>`;
  refresh(true);
}

function refresh(scrollChat){
  if(S.view==='cal'){ drawGrid(); drawAgenda(); }
  else if(S.view==='wishes'){ drawWeekTitle(); drawBoard(); }
  else if(S.view==='plans'){ drawWeekTitle(); drawPlans(); }
  else if(S.view==='chat'){ drawChat(scrollChat); }
  if(S.openId) drawComments();
  drawMe();
}

function drawGrid(){
  const y = S.month.getFullYear(), mo = S.month.getMonth();
  $('#monthTitle').textContent = S.month.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const start = new Date(y, mo, 1); start.setDate(1 - start.getDay());
  let html = '';
  for(let i=0;i<42;i++){
    const d = addDays(start,i), ds = ymd(d), evs = eventsOn(ds);
    const cls = ['day', d.getMonth()!==mo && 'out', ds===today && 'today', ds===S.sel && 'sel'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-act="pick" data-date="${ds}" aria-label="${fmtDay(ds)}, ${evs.length} events">
      <span class="num">${d.getDate()}</span>
      <span class="chips">${evs.slice(0,3).map(e=>`<i style="--c:${M(e.member).color}">${esc(e.title)}</i>`).join('')}${evs.length>3?`<em>+${evs.length-3}</em>`:''}</span>
    </button>`;
  }
  $('#grid').innerHTML = html;
}

function evRow(e, extraTag=''){
  const m = M(e.member), n = S.comments.filter(c => c.eventId===e.id).length;
  const tags = [fmtTime(e.time), m.name];
  if(e.repeat && e.repeat!=='none') tags.push('🔁 ' + REPEAT[e.repeat]);
  if(e.wishId) tags.push('⭐ Wish');
  if(extraTag) tags.unshift(extraTag);
  return `<button class="ev" style="${mv(m)}" data-act="openEvent" data-id="${e.id}">${av(m)}
    <span class="evt"><b>${esc(e.title)}</b><span class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span></span>
    ${n?`<span class="cnt" aria-label="${n} comments">💬 ${n}</span>`:''}</button>`;
}

function drawAgenda(){
  const evs = eventsOn(S.sel);
  $('#agendaTitle').textContent = S.sel===today ? 'Today' : parse(S.sel).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  $('#agenda').innerHTML = evs.length
    ? `<div class="evlist">${evs.map(e=>evRow(e)).join('')}</div>`
    : `<div class="empty">Nothing planned for this day. <button class="link" data-act="newEvent">Add an event</button></div>`;
}

function drawWeekTitle(){
  const a = S.week, b = addDays(S.week,6), o = {month:'short',day:'numeric'};
  $('#weekTitle').textContent = `${a.toLocaleDateString('en-US',o)} – ${b.toLocaleDateString('en-US',o)}`;
}

function drawBoard(){
  const wa = $('#wishAv'); if(wa) wa.innerHTML = S.me ? av(M(S.me)) : '';
  const wk = ymd(S.week);
  const ws = S.wishes.filter(w => w.week===wk).sort((a,b) => a.createdAt-b.createdAt);
  $('#board').innerHTML = PEOPLE.map(k => {
    const m = MEMBERS[k], list = ws.filter(w => w.member===k);
    return `<div class="col" style="${mv(m)}">
      <div class="colhead">${av(m)}<b>${m.name}</b><span class="n">${list.length}</span></div>
      ${list.length ? list.map(w => `<div class="wish ${w.status==='planned'?'done':''}">
        <p>${esc(w.text)}</p>
        ${w.status==='planned'
          ? `<button class="planned" data-act="openEvent" data-id="${esc(w.eventId)}">⭐ ${fmtDay(w.planDate)}${w.planTime?', '+fmtTime(w.planTime):''}</button>`
          : `<div class="wacts"><button class="mini" data-act="planWish" data-id="${w.id}">📅 Plan it</button>${w.member===S.me?`<button class="mini ghost" data-act="delWish" data-id="${w.id}" aria-label="Remove wish">✕</button>`:''}</div>`}
      </div>`).join('') : `<p class="none">No wishes yet</p>`}
    </div>`;
  }).join('');
}

function drawPlans(){
  const wk = ymd(S.week);
  const planned = S.wishes.filter(w => w.week===wk && w.status==='planned' && w.planDate)
    .sort((a,b) => (a.planDate+(a.planTime||'')).localeCompare(b.planDate+(b.planTime||'')));
  if(!planned.length){
    $('#plans').innerHTML = `<div class="empty">No plans yet. Open Weekly Wishes and tap “Plan it” on a wish.<br><br><button class="btn" data-tab="wishes">Go to Weekly Wishes</button></div>`;
    return;
  }
  let html = '', last = '';
  planned.forEach(w => {
    if(w.planDate!==last){ html += `<h3 class="dayh">${fmtDay(w.planDate)}</h3>`; last = w.planDate; }
    const e = S.events.find(x => x.id===w.eventId);
    html += e ? `<div class="evlist" style="margin-bottom:8px">${evRow(e, 'Wished by ' + M(w.member).name)}</div>` : '';
  });
  $('#plans').innerHTML = html;
}

function drawChat(scroll){
  const el = $('#chat'); if(!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = S.chat.length ? S.chat.map(c => {
    const m = M(c.by);
    return `<div class="msg ${c.by===S.me?'mine':''}" style="${mv(m)}">${av(m,'sm')}
      <div class="bubble"><small>${m.name}, ${when(c.createdAt)}</small><p>${esc(c.text)}</p></div></div>`;
  }).join('') : `<p class="empty">Say hi to the family 👋</p>`;
  if(scroll || atBottom) el.scrollTop = el.scrollHeight;
}

function drawMe(){
  const b = $('#meBtn');
  if(!S.me){ b.innerHTML = `<span>Who are you?</span>`; showWho(); return; }
  const m = M(S.me);
  b.innerHTML = `${av(m)}<span>${m.name}<small>Switch</small></span>`;
}

function showWho(){
  const w = $('#who');
  if(!w.hidden) return;
  w.innerHTML = `<div class="panel whopanel" role="dialog" aria-modal="true" aria-labelledby="whoT">
    <h2 id="whoT">Who's using this?</h2><p class="hint" style="margin:0 auto">Tap your icon.</p>
    <div class="whogrid">${PEOPLE.map(k=>`<button data-act="setMe" data-m="${k}">${av(MEMBERS[k],'big')}${MEMBERS[k].name}</button>`).join('')}</div></div>`;
  w.hidden = false;
  w.querySelector('button').focus();
}

/* ---------- sheets ---------- */
let lastFocus = null;
function sheet(html){
  lastFocus = document.activeElement;
  $('#sheetBody').innerHTML = html;
  $('#scrim').hidden = false;
  const f = $('#sheetBody').querySelector('input:not([type=radio]),button:not([data-act=close])');
  if(f) f.focus();
}
function closeSheet(){ $('#scrim').hidden = true; S.openId = null; if(lastFocus && lastFocus.isConnected) lastFocus.focus(); }

function openEvent(id){
  const e = S.events.find(x => x.id===id);
  if(!e){ toast('That event was removed'); return; }
  S.openId = id;
  const m = M(e.member);
  const whenTxt = e.repeat && e.repeat!=='none'
    ? `${REPEAT[e.repeat]} from ${fmtDay(e.date)}${e.until?' until '+fmtDay(e.until):''}`
    : fmtDay(e.date);
  sheet(`<div class="sheethead">${av(m)}<div><h2>${esc(e.title)}</h2><p class="sub">${m.name}</p></div>
      <button class="icon" data-act="close" aria-label="Close">✕</button></div>
    <div class="tags"><span class="tag">📅 ${esc(whenTxt)}</span><span class="tag">🕒 ${fmtTime(e.time)}</span>${e.wishId?'<span class="tag">⭐ From a wish</span>':''}</div>
    ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
    <div class="actions"><button class="btn danger sm" data-act="delEvent">Delete</button><button class="btn ghost sm" data-act="editEvent">Edit</button></div>
    <h3>Comments</h3>
    <div id="comments"></div>
    <form id="cForm" class="addrow"><input id="cIn" placeholder="Add a comment" maxlength="300" required autocomplete="off" aria-label="Comment"><button class="btn sm">Post</button></form>`);
  drawComments();
}

function drawComments(){
  const box = $('#comments'); if(!box) return;
  const list = S.comments.filter(c => c.eventId===S.openId).sort((a,b) => a.createdAt-b.createdAt);
  box.innerHTML = list.length ? list.map(c => { const m = M(c.by);
    return `<div class="cm">${av(m,'sm')}<div><small>${m.name}, ${when(c.createdAt)}</small><p>${esc(c.text)}</p></div></div>`; }).join('')
    : `<p class="none">No comments yet.</p>`;
}

function eventForm(e, preset={}){
  S.openId = null;
  const d = e || {title:preset.title||'', member:preset.member||S.me||'family', date:preset.date||S.sel, time:'', repeat:'none', until:'', note:''};
  const title = e ? 'Edit event' : (preset.wishId ? 'Plan this wish' : 'New event');
  sheet(`<div class="sheethead"><div><h2>${title}</h2></div><button class="icon" data-act="close" aria-label="Close">✕</button></div>
    <form id="evForm" class="form" data-id="${e?e.id:''}" data-wish="${esc(preset.wishId||'')}">
      <label>What<input name="title" required maxlength="80" value="${esc(d.title)}" placeholder="Piano lesson, beach day, birthday…"></label>
      <fieldset><legend>Who</legend><div class="who">${Object.keys(MEMBERS).map(k=>
        `<label class="whochip" style="${mv(MEMBERS[k])}"><input type="radio" name="member" value="${k}" ${d.member===k?'checked':''}>${MEMBERS[k].emoji} ${MEMBERS[k].name}</label>`).join('')}</div></fieldset>
      <div class="row2">
        <label>Date<input type="date" name="date" required value="${esc(d.date)}"></label>
        <label>Time <small>(blank = all day)</small><input type="time" name="time" value="${esc(d.time||'')}"></label>
      </div>
      <div class="row2">
        <label>Repeat<select name="repeat">${Object.entries(REPEAT).map(([k,v])=>`<option value="${k}" ${d.repeat===k?'selected':''}>${v}</option>`).join('')}</select></label>
        <label id="untilL">Until <small>(optional)</small><input type="date" name="until" value="${esc(d.until||'')}"></label>
      </div>
      <label>Notes<textarea name="note" rows="2" maxlength="300">${esc(d.note||'')}</textarea></label>
      ${e && e.repeat!=='none' ? '<p class="hint" style="margin:0">Changes apply to every repeat of this event.</p>' : ''}
      <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn">${e?'Save changes':(preset.wishId?'Add to plans':'Add event')}</button></div>
    </form>`);
  const sel = $('#evForm select[name=repeat]'), ul = $('#untilL');
  const sync = () => { ul.style.visibility = sel.value==='none' ? 'hidden' : 'visible'; };
  sel.addEventListener('change', sync); sync();
}

/* ---------- actions ---------- */
document.addEventListener('click', async ev => {
  if(ev.target.id==='scrim'){ closeSheet(); return; }
  const t = ev.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab){ show(t.dataset.tab); return; }
  const a = t.dataset.act, id = t.dataset.id;
  try {
    switch(a){
      case 'mprev': S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); refresh(); break;
      case 'mnext': S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); refresh(); break;
      case 'mtoday': S.month = new Date(now.getFullYear(), now.getMonth(), 1); S.sel = today; refresh(); break;
      case 'pick': {
        S.sel = t.dataset.date; const p = parse(S.sel);
        if(p.getMonth()!==S.month.getMonth() || p.getFullYear()!==S.month.getFullYear()) S.month = new Date(p.getFullYear(), p.getMonth(), 1);
        refresh(); break;
      }
      case 'newEvent': eventForm(null); break;
      case 'openEvent': openEvent(id); break;
      case 'editEvent': eventForm(S.events.find(x => x.id===S.openId)); break;
      case 'delEvent': {
        const e = S.events.find(x => x.id===S.openId); if(!e) return;
        if(!confirm(`Delete “${e.title}”${e.repeat!=='none'?' and all its repeats':''}?`)) return;
        closeSheet();
        await store.remove(C.events, e.id);
        if(e.wishId && S.wishes.some(w => w.id===e.wishId)) await store.update(C.wishes, e.wishId, {status:'wish', eventId:'', planDate:'', planTime:''});
        for(const c of S.comments.filter(c => c.eventId===e.id)) await store.remove(C.comments, c.id);
        toast('Event deleted'); break;
      }
      case 'close': closeSheet(); break;
      case 'wprev': S.week = addDays(S.week,-7); refresh(); break;
      case 'wnext': S.week = addDays(S.week, 7); refresh(); break;
      case 'planWish': {
        const w = S.wishes.find(x => x.id===id); if(!w) return;
        const ws = ymd(S.week), we = ymd(addDays(S.week,6));
        eventForm(null, {title:w.text, member:w.member, date:(today>=ws && today<=we) ? today : ws, wishId:w.id}); break;
      }
      case 'delWish': if(confirm('Remove this wish?')) await store.remove(C.wishes, id); break;
      case 'switchMe': showWho(); break;
      case 'setMe': S.me = t.dataset.m; lsSet('famcal:me', S.me); $('#who').hidden = true; refresh(); break;
    }
  } catch(err){ toast('Something went wrong: ' + err.message); }
});

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target;
  try {
    if(f.id==='evForm'){
      const fd = Object.fromEntries(new FormData(f));
      const data = {title:(fd.title||'').trim(), member:fd.member||'family', date:fd.date, time:fd.time||'',
        repeat:fd.repeat||'none', until:fd.repeat==='none' ? '' : (fd.until||''), note:(fd.note||'').trim()};
      if(!data.title || !data.date) return;
      closeSheet();
      if(f.dataset.id){
        await store.update(C.events, f.dataset.id, data);
        const e = S.events.find(x => x.id===f.dataset.id);
        if(e && e.wishId && S.wishes.some(w => w.id===e.wishId)) await store.update(C.wishes, e.wishId, {planDate:data.date, planTime:data.time});
        toast('Changes saved');
      } else {
        data.createdBy = S.me; data.createdAt = Date.now();
        if(f.dataset.wish) data.wishId = f.dataset.wish;
        const newId = await store.add(C.events, data);
        if(f.dataset.wish){
          await store.update(C.wishes, f.dataset.wish, {status:'planned', eventId:newId, planDate:data.date, planTime:data.time});
          toast('Added to Final Plans ⭐');
        } else toast('Event added');
      }
      if(S.view==='cal'){ S.sel = data.date; const p = parse(data.date); S.month = new Date(p.getFullYear(), p.getMonth(), 1); refresh(); }
    }
    else if(f.id==='wishForm'){
      const inp = $('#wishIn'), text = inp.value.trim(); if(!text || !S.me) return;
      inp.value = '';
      await store.add(C.wishes, {week:ymd(S.week), member:S.me, text, status:'wish', eventId:'', planDate:'', planTime:'', createdAt:Date.now()});
    }
    else if(f.id==='chatForm'){
      const inp = $('#chatIn'), text = inp.value.trim(); if(!text || !S.me) return;
      inp.value = '';
      await store.add(C.chat, {by:S.me, text, createdAt:Date.now()});
      drawChat(true);
    }
    else if(f.id==='cForm'){
      const inp = $('#cIn'), text = inp.value.trim(); if(!text || !S.me || !S.openId) return;
      inp.value = '';
      await store.add(C.comments, {eventId:S.openId, by:S.me, text, createdAt:Date.now()});
    }
  } catch(err){ toast('Could not save: ' + err.message); }
});

document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#scrim').hidden) closeSheet(); });

/* ---------- start ---------- */
show('cal');
store.listen(C.events,   a => { S.events = a; refresh(); });
store.listen(C.comments, a => { S.comments = a; refresh(); });
store.listen(C.wishes,   a => { S.wishes = a; refresh(); });
store.listen(C.chat,     a => { S.chat = a.sort((x,y) => x.createdAt-y.createdAt); refresh(); }, {latest:300});
</script>
</body>
</html>
