<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dfe7dc">
<title>Lee Family Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<!-- Firebase (compat build) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --ink:#2e3832;--ink2:#647068;--line:#dbe2d9;--wash:#f2f5f0;--card:#ffffff;
  --mustard:#f2b63f;--mustard-d:#d99a1e;--sage:#dfe7dc;--berry:#c24d6b;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--sage)}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:500;color:var(--ink);line-height:1.45;
  background-color:var(--sage);
  background-image:radial-gradient(rgba(46,56,50,.13) 1.2px,transparent 1.3px);
  background-size:22px 22px;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--mustard-d);outline-offset:3px}
.app{max-width:820px;margin:0 auto;padding:16px 14px 48px}
h1,h2,h3{font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em}

/* cute subtitle font */
.cute,.plate p,.date,.tile span,.sub,.hint,.count,.wishhero p,.note2,.tag,.bubble small,.cm small,.none,.empty,.mealhint{
  font-family:'Gaegu','Bricolage Grotesque',cursive;font-weight:700;letter-spacing:.01em}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px;
  box-shadow:0 10px 26px -18px rgba(46,56,50,.45)}

/* avatars */
.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--soft);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c);
  display:grid;place-items:center;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av.big{width:84px;height:84px;flex-basis:84px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.av.mid{width:56px;height:56px;flex-basis:56px;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--c)}
.av.sm{width:28px;height:28px;flex-basis:28px;box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--c)}

/* line icons */
.li{width:24px;height:24px;display:block}

/* home */
.topline{display:flex;justify-content:flex-end;margin-bottom:10px}
.hero{margin:6px 0 22px;padding:22px 20px 20px;background:var(--ink);color:#fff;border-radius:28px;position:relative;overflow:hidden}
.plate h1{font-size:clamp(30px,7.5vw,48px);letter-spacing:-.02em;max-width:12ch}
.plate p{margin:6px 0 0;color:#d6e2d9;font-size:21px}
.gang{display:flex;gap:10px;margin-top:18px}
.gang .av{box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--c)}

.me{flex-shrink:0;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:4px 14px 4px 4px;cursor:pointer;font-weight:700;text-align:left;line-height:1.1}
.me small{display:block;font-weight:500;color:var(--ink2);font-size:12px}

.todayc h2{font-size:24px}
.todayc .date{margin:2px 0 12px;color:var(--ink2);font-size:20px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:22px;
  text-decoration:none;min-height:140px;box-shadow:0 10px 26px -18px rgba(46,56,50,.45)}
.tile:active{transform:scale(.98)}
.tile .chip{width:44px;height:44px;border-radius:14px;background:var(--tbg);color:var(--tfg);display:grid;place-items:center;margin-bottom:auto}
.tile b{font-weight:800;font-size:19px;line-height:1.15;margin-top:14px}
.tile span{font-size:17px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.2}

/* page header */
.pagehead{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.pagehead h1{flex:1;min-width:0;font-size:clamp(24px,6vw,32px);overflow-wrap:anywhere}
.back{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--ink)}
@media (max-width:480px){.pagehead .me>span:not(.av){display:none}.pagehead .me{padding:4px}}

.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;flex:1;font-size:22px;min-width:0}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;
  cursor:pointer;display:grid;place-items:center;font-weight:700;padding:0}
.hint{color:var(--ink2);font-size:19px;margin:0 0 14px;max-width:60ch;line-height:1.25}

.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--mustard);color:var(--ink);font-weight:700;cursor:pointer;
  white-space:nowrap;text-decoration:none;display:inline-block;box-shadow:inset 0 -2px 0 var(--mustard-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.danger{background:#fff;color:var(--berry);box-shadow:inset 0 0 0 1px #f0cbd4}
.link{background:none;border:0;color:var(--berry);font-weight:700;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit}

/* calendar */
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows span{text-align:center;font-size:13px;font-weight:700;color:var(--ink2);padding-bottom:2px}
.day{min-height:90px;background:var(--wash);border:2px solid transparent;border-radius:14px;padding:5px;text-align:left;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;position:relative}
.day.out{opacity:.4}
.day.sel{border-color:var(--ink);background:#fff}
.num{font-weight:700;font-size:14px;align-self:flex-start;padding:0 5px}
.day.today .num{background:var(--ink);color:#fff;border-radius:999px;padding:0 7px}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chips i{display:block;font-style:normal;font-size:11px;font-weight:700;background:var(--c);color:#fff;border-radius:6px;
  padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink2)}
.mdots{position:absolute;top:5px;right:5px;display:flex;gap:2px;color:var(--mustard-d)}
.mdots svg{width:13px;height:13px}
@media (max-width:640px){
  .app{padding:12px 10px 34px}
  .card{padding:13px;border-radius:20px}
  .grid,.dows{gap:4px}
  .day{min-height:54px;padding:4px;border-radius:11px}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px;padding-left:3px}
  .chips i{width:8px;height:8px;padding:0;font-size:0;border-radius:50%}
  .chips em{font-size:9px}
  .mdots{top:3px;right:3px}.mdots svg{width:10px;height:10px}
}

/* event rows */
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:16px;background:var(--soft);
  border:1.5px solid transparent;text-align:left;cursor:pointer}
.ev:hover{border-color:var(--c)}
.evt{flex:1;min-width:0}
.evt b{display:block;font-size:16px;overflow-wrap:anywhere;line-height:1.2}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:15px;background:#fff;border-radius:999px;padding:0 9px;color:var(--ink2)}
.cnt{font-size:13px;font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:16px 8px;font-size:19px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(46,56,50,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;margin:0;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-height:92dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.sheethead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheethead h2{font-size:24px;overflow-wrap:anywhere}
.sheethead>div{flex:1;min-width:0}
.sub{margin:0;color:var(--ink2);font-size:18px}
.note{background:var(--wash);border-radius:14px;padding:10px 12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
h3{font-size:17px;margin:18px 0 8px}
.bigimg{display:block;width:100%;border-radius:16px}

.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
.form small{font-weight:500;color:var(--ink2)}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:700;font-size:15px;margin-bottom:6px}
.who{display:flex;gap:6px;flex-wrap:wrap}
.form .whochip{flex-direction:row;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:4px 12px 4px 4px;
  cursor:pointer;border:2px solid transparent;font-size:15px}
.whochip input{position:absolute;opacity:0;width:1px;height:1px}
.whochip:has(input:checked){border-color:var(--ink);background:#fff}
.whochip:has(input:focus-visible){outline:3px solid var(--mustard-d);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.form .seg label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){border-color:var(--ink);background:var(--wash)}

.addrow{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.addrow input{flex:1}

/* comments */
.cm{display:flex;gap:8px;margin-bottom:8px}
.cm div{background:var(--wash);border-radius:14px;padding:6px 10px;flex:1;min-width:0}
.cm small{color:var(--ink2);font-size:15px}
.cm p{margin:0;overflow-wrap:anywhere}

/* wishes: everyone */
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.person{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px;
  background:var(--soft);border-radius:20px;text-decoration:none}
.person:active{transform:scale(.98)}
.person b{font-weight:800;font-size:20px;line-height:1;margin-top:4px}
.person .count{font-size:18px;color:var(--ink2);line-height:1}
.peek{list-style:none;margin:4px 0 0;padding:0;width:100%;display:flex;flex-direction:column;gap:4px}
.peek li{background:#fff;border-radius:10px;padding:3px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}

/* wishes: one person */
.wishhero{display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:18px;padding:14px;margin-bottom:14px}
.wishhero h2{font-size:22px}
.wishhero p{margin:2px 0 0;color:var(--ink2);font-size:18px}
.wishes{display:flex;flex-direction:column;gap:10px}
.wish{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.wish p{margin:0 0 8px;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.wish.done{border-color:var(--c);background:var(--soft)}
.wacts{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;background:#fff;cursor:pointer}
.mini.plan{background:var(--mustard);border-color:var(--mustard)}
.planned{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;cursor:pointer}
.none{color:var(--ink2);font-size:18px;margin:4px 2px}
.note2{background:var(--wash);border-radius:12px;padding:8px 12px;color:var(--ink2);margin:0 0 14px;font-size:18px}
.others{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.others a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:14px}

.dayh{font-size:19px;margin:18px 0 8px}
.dayh:first-child{margin-top:0}

/* meals */
.mealday{border-top:1px solid var(--line);padding:12px 0 4px}
.mealday:first-of-type{border-top:0;padding-top:0}
.mealday h3{margin:0 0 8px;font-size:16px}
.mealrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mlabel{flex:0 0 92px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding-top:5px}
.mlabel svg{width:18px;height:18px;color:var(--mustard-d)}
.mlist{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.req{display:flex;align-items:center;gap:7px;background:var(--wash);border:1.5px solid transparent;border-radius:999px;padding:3px 4px 3px 4px;max-width:100%}
.req.chosen{background:#fff6dc;border-color:var(--mustard)}
.req span{overflow-wrap:anywhere;font-size:15px;font-weight:600;min-width:0}
.req button{border:0;border-radius:999px;background:#fff;font-size:12px;font-weight:700;padding:3px 9px;cursor:pointer;white-space:nowrap}
.req.chosen .pick{background:var(--mustard)}
.req .x{background:none;color:var(--ink2);padding:3px 6px}
.addmeal{border:1.5px dashed #b9c4b7;background:none;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink2)}
.mealhint{color:var(--ink2);font-size:18px;margin:0 0 12px}
.mealplan{display:flex;align-items:center;gap:10px;background:#fff6dc;border-radius:14px;padding:8px 12px;margin-bottom:8px}
.mealplan svg{width:20px;height:20px;color:var(--mustard-d);flex:0 0 20px}
.mealplan b{font-weight:700}
.mealplan small{display:block;color:var(--ink2);font-family:'Gaegu',cursive;font-weight:700;font-size:15px}
@media (max-width:420px){.mlabel{flex-basis:84px;font-size:13px}.mealrow{gap:6px;margin-bottom:8px}}

/* chat */
.chat{height:min(58vh,540px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px;margin-bottom:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.mine{flex-direction:row-reverse}
.bubble{background:var(--wash);border-radius:18px 18px 18px 6px;padding:5px 12px 7px;max-width:78%;min-width:0}
.msg.mine .bubble{border-radius:18px 18px 6px 18px;background:var(--soft)}
.bubble small{color:var(--ink2);font-size:15px;display:block;line-height:1.2}
.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.bubble.bare{background:none;padding:0}
.msg.mine .bubble.bare{text-align:right}
.sticker{width:112px;height:112px;display:block;object-fit:contain}
.photo{border:0;padding:0;background:none;cursor:zoom-in;display:block;margin-top:3px}
.photo img{display:block;max-width:min(240px,100%);max-height:300px;border-radius:14px}

.tray{background:var(--wash);border-radius:16px;padding:8px;margin-bottom:10px;max-height:200px;overflow-y:auto;display:grid;gap:4px}
.tray[hidden]{display:none}
.tray.emo{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
.tray.gif{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.tray button{border:0;background:none;border-radius:10px;cursor:pointer;padding:4px;display:grid;place-items:center}
.tray button:hover{background:#fff}
.tray.emo button{font-size:26px;line-height:1}
.tray.gif img{width:60px;height:60px}
.tray p{grid-column:1/-1;margin:0 4px 2px;font-size:16px;color:var(--ink2);font-family:'Gaegu',cursive;font-weight:700}
.composer{display:flex;gap:6px;align-items:center}
.composer input[type=text]{flex:1;border-radius:999px}
.tool{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:#fff;border:1px solid var(--line);cursor:pointer;
  display:grid;place-items:center;line-height:1;padding:0;font-weight:800;font-size:12px;color:var(--ink)}
.tool.on{background:var(--mustard);border-color:var(--mustard)}
.tool input{position:absolute;width:1px;height:1px;opacity:0}
.tool:has(input:focus-visible){outline:3px solid var(--mustard-d);outline-offset:2px}
.send{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--ink);border:0;cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
@media (max-width:420px){.tool{width:38px;height:38px;flex-basis:38px}.composer{gap:4px}}

/* who */
.whopanel{max-width:560px;width:100%;text-align:center}
.whopanel h2{font-size:28px;margin:0 0 4px}
.whogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:460px){.whogrid{grid-template-columns:repeat(2,1fr)}}
.whogrid button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;
  font-weight:700;font-size:17px;padding:10px;border-radius:18px}
.whogrid button:hover{background:var(--wash)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>

<div id="who" class="scrim" hidden></div>

<script>
/* ============================================================

};

/* ============================================================ */
const MEMBERS = {
  appa:   {name:'Appa',   art:'pig',   color:'#e0708c', soft:'#fde4ea'},
  umma:   {name:'Umma',   art:'cat',   color:'#d9941a', soft:'#fff0c9'},
  irene:  {name:'Irene',  art:'bear',  color:'#a8744d', soft:'#f3e4d6'},
  claire: {name:'Claire', art:'dog',   color:'#8e6fd0', soft:'#ece4ff'},
  family: {name:'Family', art:'house', color:'#4f8f6b', soft:'#dcefe3'}
};
const PEOPLE = ['appa','umma','irene','claire'];
const REPEAT = {none:"Doesn't repeat", weekly:'Every week', monthly:'Every month', yearly:'Every year'};
const C = {events:'cal_events', comments:'cal_comments', wishes:'cal_wishes', chat:'cal_chat', meals:'cal_meals'};

/* ---------- storage: Firebase or local demo ---------- */
function makeFireStore(){
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  return {
    listen(c, f, opts={}){
      let q = db.collection(c);
      if(opts.latest) q = q.orderBy('createdAt','desc').limit(opts.latest);
      q.onSnapshot(s => f(s.docs.map(d => ({...d.data(), id:d.id}))), err => toast('Sync problem: ' + err.message));
    },
    async add(c,d){ const r = await db.collection(c).add(d); return r.id; },
    async update(c,id,d){ await db.collection(c).doc(id).update(d); },
    async remove(c,id){ await db.collection(c).doc(id).delete(); }
  };
}
function makeLocalStore(){
  const L = {};
  const read = c => { try { return JSON.parse(localStorage.getItem('famcal:'+c) || '[]'); } catch(e){ return []; } };
  const emit = c => (L[c]||[]).forEach(o => o.f(o.opts.latest ? read(c).sort((a,b)=>b.createdAt-a.createdAt).slice(0,o.opts.latest) : read(c)));
  const write = (c,a) => { try { localStorage.setItem('famcal:'+c, JSON.stringify(a)); } catch(e){ toast('This device is out of space'); } emit(c); };
  addEventListener('storage', e => { if(e.key && e.key.startsWith('famcal:cal_')) emit(e.key.slice(7)); });
  return {
    listen(c,f,opts={}){ (L[c] = L[c] || []).push({f,opts}); emit(c); },
    async add(c,d){ const id = Math.random().toString(36).slice(2,9) + Date.now().toString(36); const a = read(c); a.push({...d,id}); write(c,a); return id; },
    async update(c,id,d){ write(c, read(c).map(x => x.id===id ? {...x,...d} : x)); },
    async remove(c,id){ write(c, read(c).filter(x => x.id!==id)); }
  };
}

/* ---------- repeating events ---------- */
function occursOn(e, ds){
  if(!e.date || ds < e.date) return false;
  if(e.until && ds > e.until) return false;
  if(ds === e.date) return true;
  const a = parse(e.date), b = parse(ds);
  switch(e.repeat){
    case 'weekly':  return Math.round((b-a)/864e5) % 7 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    case 'yearly':  return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
  }
  return false;
}
const eventsOn = ds => S.events.filter(e => occursOn(e,ds)).sort((a,b) => (a.time||'').localeCompare(b.time||''));

function refresh(scrollChat){
  if(S.view==='home') drawHome();
  else if(S.view==='cal'){ drawGrid(); drawAgenda(); $('#calMeals').innerHTML = mealBoard([S.sel]); }
  else if(S.view==='wishes'){ drawWeekTitle(); if(S.who) drawPerson(); else { drawPeople(); $('#weekMeals').innerHTML = mealBoard(weekDays()); } }
  else if(S.view==='plans'){ drawWeekTitle(); drawPlans(); }
  else if(S.view==='chat'){ drawChat(scrollChat); }
  if(S.openId) drawComments();
  drawMe();
}

function chatPreview(c){
  if(!c) return 'Say hi to the family';
  const n = M(c.by).name;
  if(c.img) return `${n} sent a photo`;
  if(c.gif) return `${n} sent a sticker`;
  return `${n}: ${c.text}`;
}

function drawHome(){
  const wk = ymd(weekStart(now)), ws = S.wishes.filter(w => w.week===wk);
  const evs = eventsOn(today), planned = ws.filter(w => w.status==='planned').length;
  $('#hiTitle').textContent = S.me ? `Hi, ${M(S.me).name}!` : 'Hi there!';
  $('#homeToday').innerHTML = evs.length
    ? `<div class="evlist">${evs.map(e=>evRow(e)).join('')}</div>`
    : `<p class="none" style="margin:0">Nothing planned today. <a class="link" href="#/cal">Open the calendar</a></p>`;
  $('#tCal').textContent = evs.length ? `${plural(evs.length,'thing')} today` : 'See the whole month';
  const mr = S.meals.filter(x => x.date>=wk && x.date<=ymd(addDays(weekStart(now),6))).length;
  $('#tWish').textContent = (ws.length ? `${ws.length} ${ws.length===1?'wish':'wishes'}` : 'No wishes yet') + (mr ? `, ${mr} meal ${mr===1?'request':'requests'}` : '');
  $('#homeMeals').innerHTML = chosenMeals(today);
  $('#tPlan').textContent = planned ? `${plural(planned,'plan')} this week` : 'Nothing planned yet';
  $('#tChat').textContent = chatPreview(S.chat[S.chat.length-1]);
}

function drawGrid(){
  const y = S.month.getFullYear(), mo = S.month.getMonth();
  $('#monthTitle').textContent = S.month.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const start = new Date(y, mo, 1); start.setDate(1 - start.getDay());
  let html = '';
  for(let i=0;i<42;i++){
    const d = addDays(start,i), ds = ymd(d), evs = eventsOn(ds);
    const cls = ['day', d.getMonth()!==mo && 'out', ds===today && 'today', ds===S.sel && 'sel'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-act="pick" data-date="${ds}" aria-label="${fmtDay(ds)}, ${evs.length} events">
      <span class="num">${d.getDate()}</span>${mealDots(ds)}
      <span class="chips">${evs.slice(0,3).map(e=>`<i style="--c:${M(e.member).color}">${esc(e.title)}</i>`).join('')}${evs.length>3?`<em>+${evs.length-3}</em>`:''}</span>
    </button>`;
  }
  $('#grid').innerHTML = html;
}

/* ---------- photos ---------- */
const readURL = file => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read that file')); r.readAsDataURL(file); });
async function shrink(file){
  if(file.type==='image/gif'){
    if(file.size > 700*1024) throw new Error('That GIF is too big. Pick one under 700 KB.');
    return readURL(file);
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That photo can't be opened here. Try a different one.")); i.src = url; });
    let max = 1280;
    for(let tries=0; tries<6; tries++){
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth*s)); cv.height = Math.max(1, Math.round(img.naturalHeight*s));
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      const out = cv.toDataURL('image/jpeg', .72);
      if(out.length < 700000) return out;
      max = Math.round(max*.75);
    }
    throw new Error('That photo is too big to send');
  } finally { URL.revokeObjectURL(url); }
}
async function sendPhoto(ev){
  const file = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if(!file || !S.me) return;
  if(!file.type.startsWith('image/')){ toast('Pick a photo or GIF'); return; }
  toast('Sending photo…');
  try {
    const img = await shrink(file);
    await store.add(C.chat, {by:S.me, text:'', img, createdAt:Date.now()});
    toast('Photo sent');
  } catch(err){ toast(err.message); }
}

/* ---------- actions ---------- */
document.addEventListener('click', async ev => {
  if(ev.target.id==='scrim'){ closeSheet(); return; }
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  try {
    switch(a){
      case 'mprev': S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); refresh(); break;
      case 'mnext': S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); refresh(); break;
      case 'mtoday': S.month = new Date(now.getFullYear(), now.getMonth(), 1); S.sel = today; refresh(); break;
      case 'pick': {
        S.sel = t.dataset.date; const p = parse(S.sel);
        if(p.getMonth()!==S.month.getMonth() || p.getFullYear()!==S.month.getFullYear()) S.month = new Date(p.getFullYear(), p.getMonth(), 1);
        refresh(); break;
      }
      case 'newEvent': eventForm(null); break;
      case 'openEvent': openEvent(id); break;
      case 'editEvent': eventForm(S.events.find(x => x.id===S.openId)); break;
      case 'delEvent': {
        const e = S.events.find(x => x.id===S.openId); if(!e) return;
        if(!confirm(`Delete “${e.title}”${e.repeat!=='none'?' and all its repeats':''}?`)) return;
        closeSheet();
        await store.remove(C.events, e.id);
        if(e.wishId && S.wishes.some(w => w.id===e.wishId)) await store.update(C.wishes, e.wishId, {status:'wish', eventId:'', planDate:'', planTime:''});
        for(const c of S.comments.filter(c => c.eventId===e.id)) await store.remove(C.comments, c.id);
        toast('Event deleted'); break;
      }
      case 'close': closeSheet(); break;
      case 'wprev': S.week = addDays(S.week,-7); refresh(); break;
      case 'wnext': S.week = addDays(S.week, 7); refresh(); break;
      case 'planWish': {
        const w = S.wishes.find(x => x.id===id); if(!w) return;
        const ws = ymd(S.week), we = ymd(addDays(S.week,6));
        eventForm(null, {title:w.text, member:w.member, date:(today>=ws && today<=we) ? today : ws, wishId:w.id}); break;
      }
      case 'delWish': if(confirm('Remove this wish?')) await store.remove(C.wishes, id); break;
      case 'switchMe': showWho(); break;
      case 'setMe': S.me = t.dataset.m; lsSet('famcal:me', S.me); $('#who').hidden = true; S.chatSig = ''; show(); break;
      case 'tray': setTray(t.dataset.t); break;
      case 'newMeal': mealForm(t.dataset.date, t.dataset.meal); break;
      case 'pickMeal': await pickMeal(id); break;
      case 'delMeal': if(confirm('Remove this request?')) await store.remove(C.meals, id); break;
      case 'emoji': {
        const inp = $('#chatIn'), e = t.dataset.e, s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
        inp.value = (inp.value.slice(0,s) + e + inp.value.slice(en)).slice(0,500);
        inp.setSelectionRange(s+e.length, s+e.length);
        break;
      }
      case 'sticker': {
        if(!S.me) return;
        setTray('gif');
        await store.add(C.chat, {by:S.me, text:'', gif:stickerUrl(t.dataset.c), createdAt:Date.now()});
        drawChat(true); break;
      }
      case 'viewImg': {
        const c = S.chat.find(x => x.id===id); if(!c || !okImg(c.img)) return;
        sheet(`<div class="sheethead"><div><h2>${M(c.by).name}’s photo</h2><p class="sub">${when(c.createdAt)}</p></div><button class="icon" data-act="close" aria-label="Close">✕</button></div>
          <img class="bigimg" src="${esc(c.img)}" alt="Photo from ${M(c.by).name}">`);
        break;
      }
    }
  } catch(err){ toast('Something went wrong: ' + err.message); }
});

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target;
  try {
    if(f.id==='evForm'){
      const fd = Object.fromEntries(new FormData(f));
      const data = {title:(fd.title||'').trim(), member:fd.member||'family', date:fd.date, time:fd.time||'',
        repeat:fd.repeat||'none', until:fd.repeat==='none' ? '' : (fd.until||''), note:(fd.note||'').trim()};
      if(!data.title || !data.date) return;
      closeSheet();
      if(f.dataset.id){
        await store.update(C.events, f.dataset.id, data);
        const e = S.events.find(x => x.id===f.dataset.id);
        if(e && e.wishId && S.wishes.some(w => w.id===e.wishId)) await store.update(C.wishes, e.wishId, {planDate:data.date, planTime:data.time});
        toast('Changes saved');
      } else {
        data.createdBy = S.me; data.createdAt = Date.now();
        if(f.dataset.wish) data.wishId = f.dataset.wish;
        const newId = await store.add(C.events, data);
        if(f.dataset.wish){
          await store.update(C.wishes, f.dataset.wish, {status:'planned', eventId:newId, planDate:data.date, planTime:data.time});
          toast('Added to Final Plans ⭐');
        } else toast('Event added');
      }
      if(S.view==='cal'){ S.sel = data.date; const p = parse(data.date); S.month = new Date(p.getFullYear(), p.getMonth(), 1); refresh(); }
    }
    else if(f.id==='mealForm'){
      const fd = Object.fromEntries(new FormData(f)), text = (fd.text||'').trim();
      if(!text || !S.me || !fd.meal || !fd.date) return;
      closeSheet();
      await store.add(C.meals, {date:fd.date, meal:fd.meal, by:S.me, text, status:'request', createdAt:Date.now()});
      toast('Request added');
    }
    else if(f.id==='wishForm'){
      const inp = $('#wishIn'), text = inp.value.trim(); if(!text || !S.me) return;
      inp.value = '';
      await store.add(C.wishes, {week:ymd(S.week), member:S.me, text, status:'wish', eventId:'', planDate:'', planTime:'', createdAt:Date.now()});
    }
    else if(f.id==='chatForm'){
      const inp = $('#chatIn'), text = inp.value.trim(); if(!text || !S.me) return;
      inp.value = '';
      if(S.tray==='emoji') setTray('emoji');
      await store.add(C.chat, {by:S.me, text, createdAt:Date.now()});
      drawChat(true);
    }
    else if(f.id==='cForm'){
      const inp = $('#cIn'), text = inp.value.trim(); if(!text || !S.me || !S.openId) return;
      inp.value = '';
      await store.add(C.comments, {eventId:S.openId, by:S.me, text, createdAt:Date.now()});
    }
  } catch(err){ toast('Could not save: ' + err.message); }
});

document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#scrim').hidden) closeSheet(); });
addEventListener('hashchange', show);

/* ---------- start ---------- */
show();
store.listen(C.events,   a => { S.events = a; refresh(); });
store.listen(C.comments, a => { S.comments = a; refresh(); });
store.listen(C.wishes,   a => { S.wishes = a; refresh(); });
store.listen(C.meals,    a => { S.meals = a; refresh(); });
store.listen(C.chat,     a => { S.chat = a.sort((x,y) => x.createdAt-y.createdAt); refresh(); }, {latest:300});
</script>
</body>
</html>
